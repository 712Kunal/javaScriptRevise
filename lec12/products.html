<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #products-container {
        width: 100%;
        /* border: 2px solid; */
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 20px;
        padding-block: 10px;
      }
      #product-card {
        height: 500px;
        width: 350px;
        /* border: 2px solid rgb(219, 82, 105); */
        box-shadow: 0px 0px 10px rgb(237, 69, 97);
        border-radius: 10px;
      }
      #product-img {
        height: 250px;
        width: 100%;
        object-fit: cover;
        transition-duration: 1s;
      }
      #product-img:hover {
        transform: scale(1.2);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <button onClick="above500()">Above 500</button>
      <button onClick="below500()">Below 500</button>
      <button onClick="lowToHigh()">Low to High</button>
      <button onClick="highToLow()">High to Low</button>
      <br /><br />  
      <form action="">
        <label for="">Search: </label>
        <input type="text" id="search" />
        <br /><br />
      </form>
    </div>
    <section id="products-container"></section>

    <script src="./products.js"></script>
  </body>
</html>
